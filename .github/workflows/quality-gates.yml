name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secret pattern scan
        shell: bash
        run: |
          if git grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]+ PRIVATE KEY-----|sk-[A-Za-z0-9]{20,})' -- ':!package-lock.json'; then
            echo "Potential secret pattern found" >&2
            exit 1
          fi
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke and accessibility checks
        run: npm run test:browser
